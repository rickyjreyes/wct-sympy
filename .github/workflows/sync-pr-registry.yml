name: Sync PR compiled registry

on:
  push:
    branches: [agent/promote-e15-derived]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-e15-derived
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: rickyjreyes/geometry_of_resonance
          ref: 5d63e9eab923e9c2396c221eb7d4a1312a7a4a9a
          path: geometry_of_resonance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate pinned effective registry
        run: |
          python scripts/compile_registry.py \
            --canonical-file geometry_of_resonance/WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add compiled-registry.json compiled-registry.yaml validation-report.json
          if git diff --cached --quiet; then
            echo "Compiled registry is current."
            exit 0
          fi
          git commit -m "Regenerate compiled registry for E15 promotion"
          git push origin HEAD:agent/promote-e15-derived
