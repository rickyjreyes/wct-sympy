name: Rebuild CORR2 registry

on:
  push:
    branches:
      - agent/promote-e15-derived

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-e15-derived
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch pinned canonical source
        run: |
          curl -fsSL https://raw.githubusercontent.com/rickyjreyes/geometry_of_resonance/5d63e9eab923e9c2396c221eb7d4a1312a7a4a9a/WCT_FULL_EQUATION_LIST_CORRECTED.md -o /tmp/WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Regenerate registry
        env:
          WCT_GEOMETRY_SHA: 5d63e9eab923e9c2396c221eb7d4a1312a7a4a9a
        run: python scripts/compile_registry.py --canonical-file /tmp/WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Validate derivation and reproducibility
        run: |
          pytest -q
          python scripts/check_full_coverage.py
          python scripts/verify_reproducibility.py --generated-registry compiled-registry.json
      - name: Commit generated registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiled-registry.json compiled-registry.yaml validation-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Regenerate registry at 68 PASS'
            git push origin HEAD:agent/promote-e15-derived
          fi
