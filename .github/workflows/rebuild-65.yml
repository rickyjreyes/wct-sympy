name: Rebuild 65-pass derived registry

on:
  push:
    branches:
      - agent/promote-e15-derived
    paths:
      - .github/workflows/rebuild-65.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-e15-derived
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Update expected counts and assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "scripts/compile_registry.py",
              '    "PASS": 63,\n    "CONDITIONAL": 23,',
              '    "PASS": 65,\n    "CONDITIONAL": 21,',
          )
          replace(
              "scripts/verify_reproducibility.py",
              'EXPECTED_COUNTS = {"PASS": 63, "CONDITIONAL": 23, "DEFINITION": 26, "OPEN": 30, "FAIL": 0}',
              'EXPECTED_COUNTS = {"PASS": 65, "CONDITIONAL": 21, "DEFINITION": 26, "OPEN": 30, "FAIL": 0}',
          )

          p = Path("tests/test_full_audit.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '    for equation_id in ("E32", "E41", "E72"):\n        assert results[equation_id].status == AuditStatus.CONDITIONAL',
              '    assert results["E32"].status == AuditStatus.PASS\n    for equation_id in ("E41", "E72"):\n        assert results[equation_id].status == AuditStatus.CONDITIONAL',
          )
          text = text.replace(
              '        "CONDITIONAL": 23,\n        "DEFINITION": 26,\n        "OPEN": 30,\n        "PASS": 63,',
              '        "CONDITIONAL": 21,\n        "DEFINITION": 26,\n        "OPEN": 30,\n        "PASS": 65,',
          )
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_compiled_registry.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '        "PASS": 63,\n        "CONDITIONAL": 23,',
              '        "PASS": 65,\n        "CONDITIONAL": 21,',
          )
          marker = '    assert by_id["TOP3"]["status"]["effective"] == "PASS"\n'
          additions = (
              '    assert by_id["E32"]["status"]["effective"] == "PASS"\n'
              '    assert by_id["E50"]["status"]["effective"] == "PASS"\n'
          )
          if additions not in text:
              text = text.replace(marker, marker + additions)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Fetch pinned canonical equation source
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/rickyjreyes/geometry_of_resonance/5d63e9eab923e9c2396c221eb7d4a1312a7a4a9a/WCT_FULL_EQUATION_LIST_CORRECTED.md \
            -o /tmp/WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Regenerate compiled registry
        env:
          WCT_GEOMETRY_SHA: 5d63e9eab923e9c2396c221eb7d4a1312a7a4a9a
        run: |
          python scripts/compile_registry.py \
            --canonical-file /tmp/WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Refresh frozen source hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("reproducibility/expected-source-hashes.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest["files"]
          for extra in (
              "wct_sympy/full_checks.py",
              "wct_sympy/full_checks_derived.py",
              "wct_sympy/full_checks_derived_two.py",
              "wct_sympy/full_checks_derived_three.py",
          ):
              files.setdefault(extra, "")

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              header = b"blob " + str(len(data)).encode("ascii") + bytes([0])
              return hashlib.sha1(header + data).hexdigest()

          for relative in sorted(files):
              files[relative] = git_blob_sha(Path(relative))
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Run full validation
        run: |
          pytest -q
          python scripts/check_all.py
          python scripts/check_full_coverage.py
          python scripts/check_full_coverage.py --strict-theory
          python scripts/check_lean_coverage.py
          python scripts/verify_reproducibility.py \
            --generated-registry compiled-registry.json
      - name: Commit regenerated audit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/compile_registry.py scripts/verify_reproducibility.py \
            tests/test_full_audit.py tests/test_compiled_registry.py \
            reproducibility/expected-source-hashes.json \
            compiled-registry.json compiled-registry.yaml validation-report.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Expand exact derived coverage to 65 PASS"
            git push origin HEAD:agent/promote-e15-derived
          fi
