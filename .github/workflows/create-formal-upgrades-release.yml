name: Create formal-upgrades release

on:
  push:
    paths:
      - .github/workflows/create-formal-upgrades-release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.event.before == 'aa8bae4e3e1f3f6c74a6e5691806a984f552998b'
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2026.09.11-formal-upgrades
          TARGET_SHA: aa8bae4e3e1f3f6c74a6e5691806a984f552998b
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## September 2026 formal upgrades

          This release captures the symbolic-verification upgrade batch merged on September 11, 2026.

          - Adds exact SymPy certificates for the toroidal shape selector, finite-band Hessian maximum, helix curvature scale, radial-core integrability threshold, and corrected constrained curvature-lock stationarity relation.
          - Synchronizes the verification index to the executable effective registry: **68 PASS / 18 CONDITIONAL / 26 DEFINITION / 30 OPEN**.
          - Preserves the distinction between symbolic verification and full PDE or physical validation.
          - Includes the regenerated compiled registry and validation report produced by CI after merge.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "September 2026 Formal Upgrades" \
            --notes-file /tmp/release-notes.md
